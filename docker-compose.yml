include:
  - ./searchserv/docker-compose.yml
services:
  offlinekarte-tileserver:
    image: maptiler/tileserver-gl
    container_name: offlinekarte-tileserver
    ports:
      - "8080:8080"
    volumes:
      - ./mapserv/data:/data
    environment:
      - TILESERVER_GL_ALLOWED_HOSTS=${TILESERVER_GL_ALLOWED_HOSTS:-localhost}
