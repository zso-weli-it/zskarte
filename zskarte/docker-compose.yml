services:
  postgresql-zskarte:
    image: postgres:18.1
    container_name: postgresql-zskarte
    volumes:
      - pgdata-zskarte:/var/lib/postgresql
      - ./packages/server/init:/docker-entrypoint-initdb.d:ro
    ports:
      - 127.0.0.1:55432:5432
    environment:
      - POSTGRES_PASSWORD=supersecret123
      - POSTGRES_DB=zskarte
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d zskarte"]
      start_period: 120s
      interval: 10s
      retries: 6
    restart: unless-stopped
    networks:
      - zskarte

  pgadmin-zskarte:
    image: dpage/pgadmin4:9
    container_name: pgadmin-zskarte
    restart: unless-stopped
    volumes:
      - pgadmin-zskarte:/var/lib/pgadmin
      - ./packages/server/init/servers.json:/pgadmin4/servers.json:ro
    ports:
      - 127.0.0.1:7050:80
    environment:
      - PGADMIN_DEFAULT_EMAIL=info@zskarte.ch
      - PGADMIN_DEFAULT_PASSWORD=zskarte
    networks:
      - zskarte

  server-zskarte:
    build:
      context: .
      dockerfile: Dockerfile.server
    container_name: server-zskarte
    networks:
      - zskarte
    ports: [ 1337:1337 ]
    # uploaded logos and map media live here; without the volume a rebuild deletes them
    volumes:
      - server-uploads-zskarte:/app/packages/server/public/uploads
    env_file: ./packages/server/.env
    environment:
      - DATABASE_HOST=postgresql-zskarte
      - DATABASE_PORT=5432
      - DATABASE_PASSWORD=supersecret123
      - ZSK_APP_URL=${ZSK_APP_URL:-http://localhost:4300}
      - ZSK_MAX_UPLOAD_MB=${ZSK_MAX_UPLOAD_MB:-50}
    restart: unless-stopped
    depends_on:
      postgresql-zskarte:
        condition: service_healthy

  app-zskarte:
    build:
      context: .
      dockerfile: Dockerfile.app
      args:
        ZSK_API_URL: ${ZSK_API_URL:-http://localhost:1337}
        ZSK_SEARCH_URL: ${ZSK_SEARCH_URL:-http://localhost:8000/search/}
        ZSK_TILE_URL: ${ZSK_TILE_URL:-http://localhost:8080/styles/osm-bright}
        ZSK_APP_URL: ${ZSK_APP_URL:-http://localhost:4300}
        GIT_URL: ${GIT_URL:-}
        ZSK_ORG_NAME: ${ZSK_ORG_NAME:-}
        ZSK_CODE_LOGIN: ${ZSK_CODE_LOGIN:-true}
        ZSK_WORK_LOCAL: ${ZSK_WORK_LOCAL:-true}
        COMMIT_SHA: ${COMMIT_SHA:-}
    container_name: app-zskarte
    ports: [ 4300:80 ]
    restart: unless-stopped

volumes:
  pgdata-zskarte:
  pgadmin-zskarte:
  server-uploads-zskarte:

networks:
  zskarte:
    driver: bridge
